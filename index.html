<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Запись к врачу</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-decoration bg-decoration-top"></div>
    <div class="bg-decoration bg-decoration-bottom"></div>
    <main class="container">
      <header class="page-header">
        <p class="caption">MAX Health</p>
        <h1 id="patient-name">Гость</h1>
        <p class="header-subtitle">Онлайн-запись к проверенным специалистам за 1 минуту</p>
      </header>

      <section>
        <h2>Выберите врача</h2>
        <div id="doctors-list" class="doctors-grid" aria-live="polite"></div>
      </section>
    </main>

    <template id="doctor-card-template">
      <article class="doctor-card">
        <div class="doctor-main">
          <img class="doctor-photo" src="" alt="" loading="lazy" />
          <div>
            <h3 class="doctor-name"></h3>
            <p class="doctor-speciality"></p>
            <p class="doctor-experience"></p>
          </div>
        </div>
        <button class="book-btn" type="button">Записаться</button>
      </article>
    </template>

    <div id="booking-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="booking-modal-title" hidden>
      <div class="modal-backdrop" data-modal-close></div>
      <div class="modal-panel">
        <header class="modal-header">
          <div>
            <p class="modal-caption">Запись на приём</p>
            <h2 id="booking-modal-title" class="modal-title"></h2>
            <p id="booking-modal-subtitle" class="modal-subtitle"></p>
          </div>
          <button type="button" class="modal-close" data-modal-close aria-label="Закрыть">×</button>
        </header>
        <p class="modal-slots-label">Выберите время (слоты по 30 минут)</p>
        <div id="booking-slots" class="slots-grid"></div>
        <p id="booking-confirm" class="booking-confirm" hidden></p>
      </div>
    </div>

    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <script src="./app.js" defer></script>
  </body>
</html>
